[workspace]
resolver = "2"
members = ["crates/panda-link", "crates/panda-http", "crates/pandadl", "crates/panda-app", "crates/panda-host"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
base64 = "0.22"
encoding_rs = "0.8"
percent-encoding = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# 不开 gzip/brotli：分段下载必须拿到原始字节，自动解压会让 Range 偏移对不上。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "charset"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
