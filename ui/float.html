<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>熊猫下载器</title>
<link rel="stylesheet" href="style.css">
<style>
  body.popup { padding: 8px; }
  .head { height: 42px; padding: 0 6px 0 12px; gap: 8px; }
  .total { font-size: 14px; font-weight: 600; }
  .count { font-size: 12px; color: var(--text-2); }
  .task { position: relative; padding: 9px 12px 10px; border-top: 1px solid var(--line); }
  .task .top { display: flex; align-items: center; gap: 8px; height: 22px; }
  .task .pct { font-size: 12px; color: var(--text-2); flex: none; }
  .task .ops { display: none; gap: 0; margin-right: -6px; }
  .task:hover .ops { display: flex; }
  .task:hover .pct { display: none; }
  .task .bar { margin: 6px 0 6px; }
  .stats { display: flex; align-items: center; gap: 0; height: 16px; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
  .stats > span { flex-shrink: 0; }
  .stats > span:last-child { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .stats .err { color: var(--danger); }
  .more { display: flex; align-items: center; justify-content: center; height: 34px; font-size: 12px; color: var(--accent-text); border-top: 1px solid var(--line); cursor: pointer; }
  .more:hover { background: var(--bg-hover); }
  .drop { display: none; align-items: center; justify-content: center; gap: 6px; height: 40px; margin: 0 10px 10px; border: 1.5px dashed var(--accent); border-radius: var(--radius); font-size: 12px; color: var(--accent-text); background: var(--accent-soft); }
  .drop svg { width: 16px; height: 16px; }
  body.dragging .drop { display: flex; }
  .pill { display: none; position: relative; height: 38px; padding: 0 12px 0 10px; gap: 8px; cursor: pointer; }
  .pill .total { font-size: 13px; }
  .pill .pcount { flex: none; height: 18px; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 18px; color: var(--text-2); background: var(--bg-hover); }
  .pill.warn .pcount { color: var(--danger); }
  .pill .pbar { position: absolute; left: 22px; right: 22px; bottom: 5px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .pill .pbar b { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .pill:hover { background: var(--bg-hover); }
  body.collapsed .pill { display: flex; }
  body.collapsed .full { display: none; }
  body.collapsed .card { border-radius: 999px; }
  /* 小窗口时拖链接进来：临时展开出放置区 */
  body.collapsed.dragging .pill { display: none; }
  body.collapsed.dragging .full { display: block; }
  body.collapsed.dragging .card { border-radius: var(--card-radius); }
</style>
</head>
<body class="popup collapsed">
<div class="card">
  <div class="pill row" data-act="expand" id="pill" title="点开查看每个任务">
    <img class="logo" src="logo.png" alt="" style="width:18px;height:18px;cursor:move" data-tauri-drag-region title="按住拖动">
    <span class="total num grow" id="pillText"></span>
    <span class="pcount num" id="pillCount"></span>
    <i class="pbar"><b id="pillBar"></b></i>
  </div>
  <div class="full">
    <div class="head row" data-tauri-drag-region id="head">
      <img class="logo" src="logo.png" alt="" data-tauri-drag-region>
      <span class="total num" id="total" data-tauri-drag-region></span>
      <span class="count grow num" id="count" data-tauri-drag-region></span>
      <button class="icon" data-act="main" title="打开主窗口" id="mainBtn"></button>
      <button class="icon" data-act="collapse" title="收起" id="colBtn"></button>
    </div>
    <div id="list"></div>
    <div class="drop" id="drop"></div>
  </div>
</div>
<script src="common.js"></script>
<script src="float.js"></script>
</body>
</html>
