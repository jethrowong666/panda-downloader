<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新建下载</title>
<link rel="stylesheet" href="style.css">
<style>
  .head { height: 52px; padding: 0 12px 0 18px; }
  .head .logo { width: 24px; height: 24px; border-radius: 7px; }
  .body { padding: 6px 18px 4px; }
  .file { display: flex; gap: 12px; align-items: flex-start; }
  .file .badge { flex: none; margin-top: 1px; }
  input[type="text"].fname { font-size: 14px; font-weight: 500; height: 34px; padding: 0 9px; margin-left: -1px; background: transparent; border-color: transparent; }
  input[type="text"].fname:hover { background: var(--bg-soft); }
  input[type="text"].fname:focus { background: var(--bg); border-color: var(--accent); }
  .meta { display: flex; align-items: center; flex-wrap: wrap; row-gap: 2px; min-height: 20px; margin: 2px 0 0 9px; font-size: 12px; color: var(--text-2); }
  .meta .chip { margin-left: 8px; height: 20px; }
  .lbl { font-size: 12px; color: var(--text-2); margin: 16px 0 6px; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 16px 18px 18px; }
  .foot button { height: 36px; border-radius: 12px; }
  .list { max-height: 216px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); }
  .item { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--bg-hover); }
  .item .sz { font-size: 12px; color: var(--text-2); width: 64px; text-align: right; flex: none; }
  .err { margin-top: 12px; }
  /* 视频 */
  .vid { display: flex; gap: 14px; align-items: flex-start; }
  .thumb { width: 160px; height: 90px; border-radius: 12px; flex: none; background: var(--bg-soft); object-fit: cover; position: relative; overflow: hidden; }
  .thumb.loading { background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-active) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .dur { position: absolute; right: 6px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.62); padding: 0 5px; border-radius: 4px; line-height: 18px; }
  .vtitle { font-size: 14px; font-weight: 500; line-height: 1.45; }
  .vmeta { font-size: 12px; color: var(--text-2); margin-top: 6px; display: flex; flex-wrap: wrap; }
  .qual { display: flex; flex-direction: column; gap: 6px; }
  .q { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid var(--line); background: var(--bg-soft); border-radius: 12px; cursor: pointer; transition: border-color .12s, background-color .12s; }
  .q:hover { background: var(--bg-hover); }
  .q.on { border-color: var(--accent-2); background: rgba(37, 183, 255, 0.12); box-shadow: 0 0 0 3px rgba(37, 183, 255, 0.14); }
  .q .dotr { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-2); flex: none; position: relative; }
  .q.on .dotr { border-color: var(--accent); }
  .q.on .dotr::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .q .ql { font-weight: 500; }
  .q .qd { font-size: 12px; color: var(--text-2); }
  .q .qs { margin-left: auto; font-size: 12px; color: var(--text-2); }
  .q .best { font-size: 11px; color: var(--accent-text); font-weight: 500; }
  .vname { margin-top: 12px; }
</style>
</head>
<body class="popup">
<div class="card">
  <div class="head row" data-tauri-drag-region>
    <img class="logo" src="logo.png" alt="" data-tauri-drag-region>
    <span class="title" data-tauri-drag-region id="title">新建下载</span>
    <span class="grow" data-tauri-drag-region></span>
    <span class="chip num" id="pre" hidden></span>
    <button class="icon" data-act="cancel" title="取消 (Esc)" id="closeX"></button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="common.js"></script>
<script src="confirm.js"></script>
</body>
</html>
