<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>下载完成</title>
<link rel="stylesheet" href="style.css">
<style>
  .card { position: relative; }
  .timer { position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--grad); transform-origin: left; transition: opacity .2s; }
  body.hover .timer { opacity: 0; }
  .head { height: 48px; padding: 0 8px 0 16px; gap: 10px; }
  .head .ok { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; background: var(--grad-btn); box-shadow: 0 4px 10px rgba(26, 168, 240, 0.35); }
  .head .ok svg { width: 14px; height: 14px; }
  .head .title { font-size: 15px; }
  .one { display: flex; gap: 13px; align-items: center; padding: 4px 16px 14px; }
  .acts { display: flex; gap: 10px; padding: 0 16px 14px; }
  .acts button { height: 36px; border-radius: 12px; }
  .acts .primary { flex: 1; }
  .many { border-top: 1px solid var(--line); }
  .many .item { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); }
  .many .item:last-child { border-bottom: none; }
  .many .item:hover { background: var(--bg-hover); }
  .hint { padding: 0 16px 13px; font-size: 11px; color: var(--text-3); }
</style>
</head>
<body class="popup">
<div class="card">
  <div class="timer" id="timer"></div>
  <div class="head row" data-tauri-drag-region>
    <span class="ok" id="ok"></span>
    <span class="title grow" id="title" data-tauri-drag-region>下载完成</span>
    <button class="icon" data-act="close" title="关闭 (Esc)" id="closeBtn"></button>
  </div>
  <div id="content"></div>
</div>
<script src="common.js"></script>
<script src="done.js"></script>
</body>
</html>
