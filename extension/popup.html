<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --soft:#f1f3f5; --hover:rgba(15,20,30,.045); --text:#181a1f; --t2:#5f6570; --t3:#9aa0aa; --line:rgba(15,20,30,.08); --line2:rgba(15,20,30,.14);
    --accent:#12b886; --accent-soft:#e6f8f1; --accent-text:#0a8560; --danger:#e03e3e; --danger-soft:#fdeeee; --primary:#181a1f; --pfg:#fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#23252b; --soft:#2c2e35; --hover:rgba(255,255,255,.05); --text:#eceef2; --t2:#a9aeb8; --t3:#6f7581; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --accent-soft:rgba(18,184,134,.15); --accent-text:#4fd6ab; --danger:#f06b6b; --danger-soft:rgba(240,107,107,.14); --primary:#eceef2; --pfg:#181a1f; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif; user-select: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 26px; height: 26px; border-radius: 7px; }
  header b { font-size: 14px; font-weight: 600; flex: 1; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t2); }
  .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); }
  .st.on i { background: var(--accent); }
  .st.off i { background: var(--danger); }
  section { padding: 12px 16px; }
  h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--t2); }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .item:hover { background: var(--hover); }
  .tag { flex: none; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-text); }
  .info { flex: 1; min-width: 0; }
  .info .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .s { font-size: 11px; color: var(--t3); }
  button { font: inherit; font-size: 12px; font-weight: 500; height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line2); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--soft); }
  button.primary { background: var(--primary); color: var(--pfg); border-color: transparent; }
  .big { width: 100%; height: 36px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .empty { padding: 14px 0 6px; text-align: center; color: var(--t3); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .row .tx { flex: 1; }
  .row small { display: block; color: var(--t3); font-size: 11px; }
  .sw { width: 36px; height: 20px; border-radius: 10px; background: var(--line2); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on { background: var(--accent); }
  .sw.on::after { left: 19px; }
  .warn { margin: 12px 16px 0; padding: 9px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 12px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--t3); }
  footer a { color: var(--accent-text); cursor: pointer; text-decoration: none; font-weight: 500; }
  .toast { color: var(--accent-text); font-size: 12px; text-align: center; padding-top: 6px; min-height: 18px; }
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><b>熊猫下载器</b><span class="st" id="st"><i></i><span>连接中…</span></span></header>
<div id="warn"></div>
<section>
  <h3>本页视频</h3>
  <div id="media"></div>
  <div class="toast" id="toast"></div>
</section>
<section style="border-top:1px solid var(--line)">
  <div class="row"><div class="tx">接管浏览器下载<small>按住 Alt 点击链接可以临时用浏览器下载</small></div><div class="sw" id="take"></div></div>
</section>
<footer><span id="ver"></span><a id="open">打开熊猫下载器</a></footer>
<script src="popup.js"></script>
</body>
</html>
